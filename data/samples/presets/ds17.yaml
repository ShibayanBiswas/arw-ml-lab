  - data/samples/predict/sklearn_digits_predict.csv
  - data/samples/predict/sklearn_wine_predict.csv
feature_contracts:
  - data/samples/predict/contracts/sklearn_diabetes.feature_contract.json
  - data/samples/predict/contracts/sklearn_digits.feature_contract.json
  - data/samples/predict/contracts/sklearn_wine.feature_contract.json
