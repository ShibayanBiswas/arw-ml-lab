file: "sklearn.datasets.load_diabetes / load_digits / load_wine"
family: supervised
task: regression (diabetes) / multiclass (digits, wine)
target: "target"
cv: kfold (diabetes) / stratified_kfold
seed: 42
notes: "bundled with scikit-learn (sklearn.datasets.load_*); no download"
predict_samples:
