# Supabase CLI project config (minimal). If the CLI version expects more keys, run `supabase init --force`
# in a scratch folder and merge; keep the values below.
project_id = "arw-ml-lab"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
# Mirrors the bucket limits in migrations 20261115000000/…100 (ST-CON-04). Hosted: set the project's
# global file size limit to 2 GB (Pro plan; the Free plan caps every upload at 50 MB).
file_size_limit = "2GiB"

[storage.buckets.datasets]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["text/csv", "text/plain", "application/vnd.ms-excel", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.apache.parquet", "application/octet-stream", "application/json"]

[storage.buckets.artefacts]
public = false
file_size_limit = "100MiB"

[storage.buckets.models]
public = false
file_size_limit = "2GiB"

[storage.buckets.reports]
public = false
file_size_limit = "100MiB"
allowed_mime_types = ["application/pdf", "text/html", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.openxmlformats-officedocument.presentationml.presentation", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"]

[storage.buckets.plots]
public = false
file_size_limit = "100MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/svg+xml", "application/json"]

[storage.buckets.predictions]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["text/csv", "text/plain", "application/vnd.ms-excel", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.apache.parquet", "application/octet-stream"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# CLI v3: [inbucket] removed — use [local_smtp] (keys unchanged)
[local_smtp]
enabled = true
port = 54324
