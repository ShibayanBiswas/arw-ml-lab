name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "supabase db push --dry-run only (no apply, no Contabo deploy)"
        type: boolean
        default: false
      image_tag:
        description: "Optional IMAGE_TAG override (SHA already in GHCR); empty = github.sha"
        type: string
        default: ""

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: "3.1.0" } # pinned Phase 0 (ST-OPS-10); bump deliberately
      - name: Require Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN missing — set GitHub Environment production secret" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "SUPABASE_PROJECT_ID missing — set GitHub Environment production secret (e.g. ushtfpelbpjfkjoppklz)" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "SUPABASE_DB_PASSWORD missing — set GitHub Environment production secret" && exit 1)
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Migration dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: supabase db push --dry-run --yes
      - name: Apply migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: supabase db push --remote --yes

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - svc: api
            lock: backend/requirements/api.lock.txt
          - svc: worker-light
            lock: backend/requirements/worker-light.lock.txt
          - svc: worker-train
            lock: backend/requirements/worker-train.lock.txt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: tags
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "sha=$SHA"
            echo "owner=$OWNER"
            echo "image=ghcr.io/${OWNER}/arw-ml-lab-${{ matrix.svc }}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            REQUIREMENTS_LOCK=${{ matrix.lock }}
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.image }}:main
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}

  deploy:
    needs: [migrate, build]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require Contabo secrets
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          test -n "$CONTABO_HOST" || (echo "CONTABO_HOST missing" && exit 1)
          test -n "$CONTABO_USER" || (echo "CONTABO_USER missing" && exit 1)
          test -n "$CONTABO_SSH_KEY" || (echo "CONTABO_SSH_KEY missing" && exit 1)
          test -n "$CONTABO_KNOWN_HOSTS" || (echo "CONTABO_KNOWN_HOSTS missing" && exit 1)
      - name: Write SSH key and known_hosts
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CONTABO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Resolve IMAGE_TAG
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "sha=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy compose, Caddyfile, deploy.sh, backup script
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "${CONTABO_USER}@${CONTABO_HOST}" \
            'mkdir -p /opt/arw-ml-lab/infra/caddy /opt/arw-ml-lab/infra/contabo /opt/arw-ml-lab/scripts /opt/arw-ml-lab/backups'
          scp -o StrictHostKeyChecking=yes docker-compose.prod.yml \
            "${CONTABO_USER}@${CONTABO_HOST}:/opt/arw-ml-lab/docker-compose.prod.yml"
          scp -o StrictHostKeyChecking=yes infra/caddy/Caddyfile \
            "${CONTABO_USER}@${CONTABO_HOST}:/opt/arw-ml-lab/infra/caddy/Caddyfile"
          scp -o StrictHostKeyChecking=yes infra/contabo/deploy.sh \
            "${CONTABO_USER}@${CONTABO_HOST}:/opt/arw-ml-lab/deploy.sh"
          scp -o StrictHostKeyChecking=yes scripts/backup_contabo.sh \
            "${CONTABO_USER}@${CONTABO_HOST}:/opt/arw-ml-lab/scripts/backup_contabo.sh"
          ssh -o StrictHostKeyChecking=yes "${CONTABO_USER}@${CONTABO_HOST}" \
            'chmod 750 /opt/arw-ml-lab/deploy.sh /opt/arw-ml-lab/scripts/backup_contabo.sh'
      - name: GHCR login + deploy
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token on stdin only — never on the remote argv
          printf '%s\n' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=yes \
            "${CONTABO_USER}@${CONTABO_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin && /opt/arw-ml-lab/deploy.sh '${IMAGE_TAG}'"

  smoke:
    needs: deploy
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Hosted smoke
        env:
          LAB_API_URL: ${{ vars.LAB_API_URL }}
          SMOKE_EDA: ${{ vars.SMOKE_EDA }}
        run: |
          test -n "$LAB_API_URL" || (echo "LAB_API_URL variable missing" && exit 1)
          for _attempt in $(seq 1 30); do
            if curl -fsS "$LAB_API_URL/healthz"; then
              echo
              echo "healthz ok (attempt ${_attempt})"
              if [ "${SMOKE_EDA}" = "true" ]; then
                bash scripts/smoke_hosted.sh
              else
                echo "SMOKE_EDA not true — healthz only"
              fi
              exit 0
            fi
            sleep 10
          done
          exit 1
