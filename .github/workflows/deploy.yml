name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: "3.1.0" }  # pinned Phase 0 (ST-OPS-10); bump deliberately
      - name: Require Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN missing" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "SUPABASE_PROJECT_ID missing" && exit 1)
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --remote --yes

  render:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploys after migrations (autoDeployTrigger=off)
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_LIGHT: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER_LIGHT }}
          HOOK_TRAIN: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER_TRAIN }}
        run: |
          missing=0
          for name_h in "API:$HOOK_API" "LIGHT:$HOOK_LIGHT" "TRAIN:$HOOK_TRAIN"; do
            name="${name_h%%:*}"
            h="${name_h#*:}"
            if [ -z "$h" ]; then
              echo "WARN: RENDER_DEPLOY_HOOK_$name empty"
              missing=1
            else
              curl -fsS -X POST "$h" > /dev/null
              echo "triggered $name"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more deploy hooks missing — set GitHub Environment secrets"
            exit 1
          fi

  # Vercel deploys through its Git integration (Root Directory = frontend).

  smoke:
    needs: render
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Wait for lab-api healthz
        env: { LAB_API_URL: "${{ vars.LAB_API_URL }}" }
        run: |
          test -n "$LAB_API_URL" || (echo "LAB_API_URL variable missing" && exit 1)
          for i in $(seq 1 30); do
            if curl -fsS "$LAB_API_URL/healthz"; then
              echo
              echo "healthz ok"
              exit 0
            fi
            sleep 20
          done
          exit 1
      - name: Optional DS1 EDA smoke (when AUTH_TEST_BYPASS enabled on staging only)
        env:
          LAB_API_URL: ${{ vars.LAB_API_URL }}
          SMOKE_EDA: ${{ vars.SMOKE_EDA }}
        run: |
          if [ "${SMOKE_EDA}" != "true" ]; then
            echo "SMOKE_EDA not true — skipping sample EDA (set vars.SMOKE_EDA=true for staging)"
            exit 0
          fi
          bash scripts/smoke_hosted.sh
