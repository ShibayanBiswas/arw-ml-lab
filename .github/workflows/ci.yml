name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          # defaults.working-directory does not apply to `uses:` — point at frontend packageManager
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm exec tsc --noEmit && pnpm test --run && pnpm build
      - name: No AI provider secrets in the client bundle
        run: "! grep -R -E 'NVIDIA_API_KEY|nvapi-|SUPABASE_SERVICE_ROLE_KEY' .next/static || (echo 'secret found in bundle' && exit 1)"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --frozen
      # pyproject.dev extras are API/tooling only; unit tests need ML pins (use .txt not .lock —
      # uv cannot resolve pip-compile lock files that pin hashes against a conflicting base env)
      - name: Install ML stack for unit tests
        run: >
          uv pip install
          -r backend/requirements/ml-core.txt
          -r backend/requirements/eda.txt
          -r backend/requirements/xai-uq.txt
          statsforecast==2.1.1
          utilsforecast==0.2.17
          coreforecast==0.0.20
      - run: uv run ruff check labcore backend tests && uv run ruff format --check labcore backend tests && uv run mypy labcore
      - env:
          LAB_DEFAULT_SEED: "42"
          AI_ENABLED: "false"
          AUTH_TEST_BYPASS: "true"
        run: uv run pytest tests/unit tests/contract_tradinglab tests/golden -q

  kit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pandas==2.3.3 pyarrow==26.0.1 jsonschema==4.26.0 pytest pyyaml
      - run: pytest tests/unit/test_predict_samples.py -q
      - name: render.yaml parses
        run: python -c "import yaml; yaml.safe_load(open('render.yaml')); print('render.yaml ok')"
      - name: maintenance CLI smoke
        run: PYTHONPATH=. python -m backend.worker.maintenance --all
      - name: Hosted frontend e2e smoke (httpx)
        env:
          E2E_STRICT: "1"
          E2E_BASE_URL: https://arw-ml-lab.vercel.app
        run: |
          pip install httpx==0.28.1
          PYTHONPATH=. pytest tests/e2e -q -m e2e --tb=short

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with: { version: "3.1.0" }  # pinned Phase 0 (ST-OPS-10); bump deliberately
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - if: always()
        run: supabase stop
