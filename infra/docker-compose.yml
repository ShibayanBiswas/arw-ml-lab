# Local stack (Phase 0). Postgres/Auth/Storage come from `supabase start`.
# AI: set NVIDIA_API_KEY in ../.env or leave empty (numbers-only / mocked).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lab-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_LOCK: backend/requirements/api.lock.txt
    command: >
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      SERVICE_ROLE: api
      LAB_DEFAULT_SEED: "42"
      AI_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_LOCK: backend/requirements/api.lock.txt
    command: >
      celery -A backend.worker.celery_app worker
      -Q q.ingest,q.eda,q.insights,q.report,q.predict.batch,q.demo
      --concurrency 1 --loglevel=INFO
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      SERVICE_ROLE: worker-light
      LAB_DEFAULT_SEED: "42"
      AI_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://host.docker.internal:54321
      NEXT_PUBLIC_LAB_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lab-api:
        condition: service_healthy

volumes:
  frontend_node_modules:
