# OWASP ZAP baseline (Phase 7 / ARCHITECTURE §26) — run manually:
#   docker run --rm -v $(pwd):/zap/wrk owasp/zap2docker-stable \
#     zap-baseline.py -t https://arw-ml-lab.vercel.app -c zap-baseline.yaml
#
# Not executed in CI until lab-api is live (Render blocked). Failures on
# authenticated API routes are expected without a session cookie.
env:
  contexts:
    - name: "arw-ml-lab-public"
      urls:
        - "https://arw-ml-lab.vercel.app"
      includePaths:
        - "https://arw-ml-lab.vercel.app.*"
      excludePaths:
        - "https://arw-ml-lab.vercel.app/api/.*"
rules:
  # Informational noise from Next.js static assets — warn only
  - id: 10015
    threshold: IGNORE
  - id: 10027
    threshold: WARN
